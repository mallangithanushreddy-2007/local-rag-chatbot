<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="sidebar">
        <button class="new-chat-btn" onclick="newChat()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"></path></svg>
            New chat
        </button>
        <div class="sidebar-section">
            <p class="section-title">Models</p>
            <select id="modelSelect">
                <option value="llama3">llama3</option>
                <option value="phi3">phi3</option>
                <option value="mistral">mistral</option>
                <option value="gemma2">gemma2</option>
            </select>
        </div>
        <div class="sidebar-section">
            <p class="section-title">Documents</p>
            <input type="file" id="fileUpload" multiple accept=".pdf,.txt" onchange="uploadFiles()">
            <div id="uploadStatus"></div>
        </div>
    </div>
    
    <div class="main-content">
        <header>
            <div class="header-logo">Gemini Clone</div>
        </header>
        
        <div class="chat-container" id="chatContainer">
            <div class="empty-state" id="emptyState">
                <h1>Hello, Thanush</h1>
                <p>How can I help you today?</p>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-box">
                <input type="text" id="chatInput" placeholder="Enter a prompt here" onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
                </button>
            </div>
            <p class="disclaimer">Gemini Clone may display inaccurate info, including about people, so double-check its responses.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
