name: Local RAG Chatbot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install the test dependencies if they aren't fully specified
        pip install pytest pytest-mock

    - name: Run Pytest
      run: |
        # Run the automated tests against the RAG pipeline
        pytest tests/
